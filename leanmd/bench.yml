# LeanMD JUBE benchmark. Two tags: `base` (plain) and `tracing`
# (-tracemode projections, +logsize, archives the trace on completion).
# Run with:
#   jube run leanmd/bench.yml --include-path <jube>/platform/slurm --tag base
#
# Editing note: text inside the `_: |` block scalars becomes a JUBE parameter
# value, and JUBE splits those on commas. Keep block bodies comma-free.
# YAML-level comments like this one are stripped by the parser and are safe.
#
# Background and rationale: ../docs/design-notes.org
name: leanmd
# $jube_benchmark_home is this file's directory, so paths below are relative
# to leanmd/, not to the repo root -- and so is outpath, which therefore puts
# JUBE's output directory here alongside the definition and the run log.
# Trace archives are left inside its numbered run directories.
outpath: leanmd_bench

parameterset:
  - name: globalParameter
    parameter:
      - name: modules
        _: |
          module purge
          module load mpich/3.1.4-gcc-9.3.0 gcc/9.3.0
      - name: oversubscription
        _: "1"
      # This file lives in leanmd/, so $jube_benchmark_home is that directory.
      # deps/ is shared with ChaNGa and stays at the repo root -- reach it
      # through $repo_root rather than $jube_benchmark_home.
      - name: repo_root
        _: $jube_benchmark_home/..
      - name: source_dir
        _: $jube_benchmark_home/src
  - name: systemParameter
    init_with: platform.xml
    parameter:
      - name: nodes
        _: "1,2,4"
      - name: taskspernode
        _: "20"
      - name: threadspertask
        _: "1"
      - name: preprocess
        tag: base
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH
          sed 4d Makefile -i
          sed 4i"CHARMBASE=$repo_root/deps/prefix/charm-base" Makefile -i
          make -j
      - name: preprocess
        tag: tracing
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH
          sed 4d Makefile -i
          sed 4i"CHARMBASE=$repo_root/deps/prefix/charm-projections" Makefile -i
          make projections OPTS="-O3 -DLEANMD_TRACE_TIMESTEPS -I$repo_root/deps/prefix/include $(pkgconf --libs papi)" -j
      # These globs are the complete set of files Charm's -tracemode projections
      # writes: one <pe>.log (or .log.gz) per rank, one shared .sts, one shared
      # .projrc. Verified against ../deps/charm/src/ck-perf/trace-projections.C
      # (createLog/createSts/createRC). *.log* covers both plain and gzipped.
      # The archive stays in this workpackage's JUBE work directory on purpose;
      # nothing copies or indexes it elsewhere. See runs.org.
      - name: postprocess
        tag: tracing
        _: |
          tar -czf trace_${SLURM_JOBID}_${SLURM_NNODES}_${SLURM_NTASKS}.tar.gz *.log* *.sts *.projrc
          rm *.log* *.sts *.projrc
          ls -l ./leanmd.domain.csv
      - name: gres
        _: ""
      - name: queue
        _: kura-wide
      - name: timelimit
        _: 00:20:00
      - name: additional_job_config
        _: >
          #SBATCH --exclusive
      - name: executable
        tag: base
        _: ./leanmd
      - name: executable
        tag: tracing
        _: ./leanmd.prj
      - name: args_exec
        tag: base
        _: 10 10 10 100 20 20
      - name: args_exec
        tag: tracing
        _: 10 10 10 100 20 20 +logsize 32000000
  - name: inputset
    parameter:
      - name: total_pes
        type: int
        mode: python
        _: "${nodes}*${taskspernode}*${oversubscription}"
  - name: executeset
    init_with: platform.xml
    parameter:
      - name: starter
        _: mpirun
      - name: args_starter
        _: -np $total_pes

fileset:
  - name: source_dir
    copy:
      - $source_dir/Makefile
      - $source_dir/*.cc
      - $source_dir/*.h
      - $source_dir/*.ci

step:
  - name: run-program
    use:
      - globalParameter
      - systemParameter
      - inputset
      - executeset
      - source_dir
      - from: platform.xml
        _: jobfiles
      - from: platform.xml
        _: executesub
    do:
      done_file: $done_file
      _: $submit $submit_script
