# ChaNGa JUBE benchmark, same tag-gated base/tracing structure as
# ../leanmd/bench.yml, plus a second mandatory tag choosing the initial
# condition. Every run needs one tag from each pair:
#
#   base | tracing   -- untraced baseline, or built with -tracemode projections
#   cosmo | poisson  -- cube300 LCDM initial condition, or the synthetic cube
#
#   jube run changa/bench.yml --include-path <jube>/platform/slurm \
#        --tag tracing cosmo
#
# Omitting an IC tag leaves ic_param_file, ic_infile, ic_generate, nsteps and
# problem_size all undefined, so JUBE fails rather than silently picking one.
# cosmo is the primary case for the CCGrid work; poisson is its control.
#
# Editing note, learned across two failed runs: text inside the `_: |` block
# scalars becomes a JUBE parameter value, and JUBE splits those on commas, so
# a single comma anywhere in a preprocess body (even in a shell comment) chops
# the step and only a fragment reaches submit.job. Keep block bodies
# comma-free. YAML-level comments like this one are stripped by the parser
# before JUBE sees them and are safe.
#
# Background and rationale: ../docs/design-notes.org
name: changa
# $jube_benchmark_home is this file's directory, so paths below are relative
# to changa/, not to the repo root -- and so is outpath, which therefore puts
# JUBE's output directory here alongside the definition and the run log.
# Trace archives are left inside its numbered run directories.
outpath: changa_bench

parameterset:
  - name: globalParameter
    parameter:
      - name: modules
        _: |
          module purge
          module load mpich/3.1.4-gcc-9.3.0 gcc/9.3.0
      - name: oversubscription
        _: "1"
      # This file lives in changa/, so $jube_benchmark_home is that directory.
      # deps/ is shared with LeanMD and stays at the repo root -- reach it
      # through $repo_root rather than $jube_benchmark_home.
      - name: repo_root
        _: $jube_benchmark_home/..
      - name: source_dir
        _: $jube_benchmark_home/src
      - name: structures_dir
        _: $repo_root/deps/utility/structures
      # ---- Initial condition -------------------------------------------
      # Two mutually exclusive tags, `cosmo` and `poisson`, select which IC a
      # run uses. They are separate experiments rather than a swept dimension:
      # cosmo (cube300) is the primary case and poisson is its control, with
      # the same binary, decomposition and step count and only the physics
      # differing. A JUBE parameter would have produced a cross product with
      # problem_size, most of whose cells are meaningless -- cube300 has a
      # fixed particle count and cannot be resized.
      #
      # Measured 2026-08-07: across 64 equal-count TreePieces the cosmological
      # run shows 2.4x the density spread of the Poisson cube at z=0 (max/mean
      # 6.4 vs 2.7). The Poisson cube is *not* homogeneous at grid scale -- it
      # is homogeneous at decomposition scale, which is the scale that matters
      # here. See ccgrid2027/notes/phase03-initial-conditions.md.
      - name: ic_param_file
        tag: cosmo
        _: testcosmo/cube300.param
      - name: ic_param_file
        tag: poisson
        _: testdata/testdata.param
      # ChaNGa opens achInFile relative to the launch cwd (the workpackage
      # root) rather than to the param file that names it, so the bare filename
      # each param ships with has to be repointed at its subdirectory.
      - name: ic_infile
        tag: cosmo
        _: testcosmo/cube300.tbin
      - name: ic_infile
        tag: poisson
        _: testdata/testdata.tbin
      # cube300.tbin is a real LCDM IC committed in the ChaNGa tree, so there
      # is nothing to generate. The Poisson cube is synthesised per run by
      # testdata's own generator at the swept particle count.
      - name: ic_generate
        tag: cosmo
        _: "true"
      #
      # testdata's standalone Makefile hardcodes its compile line and predates
      # glibc moving the SunRPC/XDR headers into libtirpc. On hosts where the
      # rpc headers now live under /usr/include/tirpc we point its CC/CXX there
      # by hand (ChaNGa's own ./configure already does the equivalent for its
      # main build) -- a no-op where the rpc headers are still in libc. This
      # lives here rather than in the preprocess bodies because it applies only
      # to the generator: the cosmological IC ships as a committed file and
      # never invokes that Makefile.
      - name: ic_generate
        tag: poisson
        _: |
          tirpc_flags=""
          if [ -f /usr/include/tirpc/rpc/types.h ]; then
            tirpc_flags="-I/usr/include/tirpc -ltirpc"
          fi
          make -C testdata N=$problem_size CC="gcc $tirpc_flags" CXX="g++ $tirpc_flags"
  - name: systemParameter
    init_with: platform.xml
    parameter:
      # ---- Core allocation ---------------------------------------------
      # Default: 20 tasks on a 20-core host. The Charm++ builds are SMP, so
      # each task is 1 worker + 1 comm thread and the node runs 40 threads on
      # 20 physical cores -- every worker shares a core with a comm thread.
      # That is full utilisation of the 40 PUs the node advertises but it means
      # measured per-element execution time carries contention that has nothing
      # to do with load, which matters when the trace is being used to *predict*
      # load.
      #
      # The `dedicated` tag halves tasks per host and doubles the host count, so
      # PE counts stay 20/40/80 and the decomposition is unchanged, but each
      # worker gets a physical core to itself. Note this necessarily also
      # doubles the node count at a given PE count -- tasks-per-node cannot be
      # changed at fixed PE count without it -- so the two effects are
      # entangled by construction and the NODEcross measurements are what
      # separate them.
      - name: nodes
        tag: "!dedicated"
        _: "1,2,4"
      # 2,4 rather than 2,4,8: `kura-wide` has MaxNodes=4 and every other
      # partition on Kabre caps at 1, so an 8-node job is rejected outright with
      # PartitionNodeLimit. The default sweep's 4-node cell is already at the
      # machine ceiling -- 80 PEs is the most this cluster can express.
      - name: nodes
        tag: dedicated
        _: "2,4"
      - name: taskspernode
        tag: "!dedicated"
        _: "20"
      - name: taskspernode
        tag: dedicated
        _: "10"
      # `ppn`: one SMP process per host driving 19 worker threads and 1 comm
      # thread on the 20 physical cores. This is how a Charm++ SMP build is
      # normally driven; the default 20 processes at +ppn 1 gives every worker
      # its own comm thread and spends half the node on them. Measured
      # 2026-08-08 that costs 15-26% of per-element load predictability.
      #
      # threadspertask becomes --cpus-per-task so the process is allowed its
      # 20 threads; total_pes (and hence mpirun -np) is nodes*taskspernode
      # which is now one rank per host.
      #
      # PE counts become 19/38/76 against the default 20/40/80 -- deliberately
      # comparable rather than larger. +ppn 39 would reach 156 PEs on the same
      # 4 nodes by using both hyperthreads per core, which is the way to extend
      # the scaling range given kura-wide caps at MaxNodes=4.
      - name: taskspernode
        tag: ppn
        _: "1"
      - name: threadspertask
        _: "1"
      - name: threadspertask
        tag: ppn
        _: "20"
      # Empty unless the ppn tag is active. Kept as its own parameter so the
      # tracing/base args_exec bodies do not need tag combinations.
      - name: ppn_flag
        _: ""
      - name: ppn_flag
        tag: ppn
        _: +ppn 19
      # `ppnhyper`: the same one-rank-per-host shape but 39 workers on the 40
      # hyperthreads instead of 19 on the 20 physical cores. Two workers share
      # a physical core -- contention again -- but two *compute* threads share
      # far better than a compute thread and a busy-polling comm thread.
      #
      # This is the only remaining route to a larger configuration: kura-all no
      # longer exists and kura-wide caps at MaxNodes=4 so 4 hosts is the
      # ceiling. It reaches 156 PEs there against 76 for `ppn` and 80 for the
      # default. Use instead of `ppn` rather than alongside it.
      - name: taskspernode
        tag: ppnhyper
        _: "1"
      - name: threadspertask
        tag: ppnhyper
        _: "40"
      - name: ppn_flag
        tag: ppnhyper
        _: +ppn 39
      # Spliced into the copied param file during preprocess, rather than
      # passed on the command line the way LeanMD's step count is.
      #
      # cube300 is an LCDM initial condition designed to integrate z=19 to z=0
      # in 128 steps; truncating it to 20 would stop the run partway through
      # structure formation and defeat the point of using it. The Poisson cube
      # has no such designed endpoint and stays at 20.
      - name: nsteps
        tag: cosmo
        _: "128"
      - name: nsteps
        tag: poisson
        _: "20"
      # Timestep accuracy criterion. This is ChaNGa's own shipped default
      # (ParallelGravity.cpp:299); cube300.param ships 0.175 instead which is
      # nearly 6x looser and is why it is being overridden rather than left
      # alone.
      #
      # It is not a performance knob here -- it decides whether the runs
      # multistep at all. A particle's rung is ceil(log2(dDelta/dt)) with
      # dt = dEta*sqrt(eps/|a|) and a floor at rung 0. At 0.175 cube300's whole
      # rung distribution sits below that floor: measured on 2026-08-08 every
      # step past 102 of 128 put all 110592 particles on rung 0. Each halving
      # of dEta lifts the same distribution up exactly one rung -- 3 populated
      # rungs at 0.05 and 5 at 0.0125 -- so the structure was always there and
      # only the clamp hid it. Under one rung the multistep load balancer
      # degenerates to naive persistence and there is nothing to predict.
      #
      # Costs runtime roughly linearly in the substep count: 83s at 0.175 and
      # 322s at 0.025 for 128 steps on 8 PEs untraced.
      - name: deta
        _: "0.03"
      # Stop after this many big steps minus one -- killAt breaks out of
      # doSimulation()'s loop *before* running step killAt so killAt = 17
      # completes 16. Zero disables it.
      #
      # This is how the traced window is bounded and it is deliberately not
      # done by shrinking nSteps. dDelta scales as 1/nSteps and rung is
      # ceil(log2(dDelta/dt)) so a shorter nSteps is a physically different
      # run with more rungs and more substeps per step -- measured on
      # 2026-08-08 at nSteps = 16 the first big step reached rung 8 and took
      # 438 s. killAt leaves dDelta at its 128-step value and simply stops
      # early.
      #
      # 16 is chosen so the Projections buffer never fills. Charm++ reserves
      # the whole +logsize pool at startup and flushes only when it is exactly
      # full (deps/charm/src/ck-perf/trace-projections.C:157 and :494) by
      # synchronously compressing and writing the lot -- measured at ~250 MB
      # and ~150 s per flush on a 128-step run which is why that run was
      # cancelled. Charm++ then prints "The performance data is likely invalid"
      # and inserts BEGIN_INTERRUPT / END_INTERRUPT into the trace so a flushed
      # run is not merely slow but unusable. Check job.out for "Projections log
      # flushed to disk" after any change to this or to +logsize.
      #
      # The early steps are also where the signal is: rung structure is richest
      # at the start and decays through the run.
      - name: killat
        tag: cosmo
        _: "17"
      - name: killat
        tag: poisson
        _: "0"
      # How often ChaNGa writes a snapshot. Left at the shipped 128 so the
      # traced window writes none at all -- that is the measured baseline and
      # this parameter exists to make changing it explicit rather than to
      # change it.
      #
      # Setting it to 1 is what populates density_mean / density_max in the
      # physics side file: ChaNGa computes its neighbour density estimate only
      # inside Main::writeOutput() under bDoDensity (ParallelGravity.cpp:3000)
      # so those columns read 0 until the first output. That is worth wanting --
      # measured 2026-08-08 the free geometric proxies are useless as load
      # predictors (within-phase Spearman -0.06..0.04 for n_particles/bb_volume
      # at every rung) because equal-count Morton splitting strips geometric
      # extent of its information.
      #
      # It is not free. Each output adds a full neighbour-search pass plus a
      # tipsy write per big step which lands between the GravityPhase brackets
      # rather than inside them -- so it does not pollute the phase intervals
      # but it does add wall time and trace volume. Re-measure the perturbation
      # if you change this.
      - name: ioutinterval
        _: "128"
      # The preprocess clones ChaNGa instead of using a JUBE fileset: ChaNGa
      # generates cha_commitid.c by running `git describe`, which needs an
      # intact .git that a file copy would lose, and each workpackage needs its
      # own build tree so concurrent node-count/problem-size combinations don't
      # race on the same object files. The clone-then-move-.git dance works
      # around JUBE having already written submit.job into this directory,
      # which makes `git clone --local $source_dir .` refuse to run.
      - name: preprocess
        tag: base
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH

          git clone --local $source_dir changa-src
          mv changa-src/.git .
          rm -rf changa-src
          git checkout .
          cp -r $structures_dir ./structures
          export STRUCT_DIR=$PWD/structures
          export CHARM_DIR=$repo_root/deps/prefix/charm-changa

          sed -i "s/^nSteps.*/nSteps = $nsteps/" $ic_param_file
          # Both param files name their input as a bare achInFile which ChaNGa
          # opens relative to the launch cwd (the workpackage root) rather than
          # to the param file -- repoint it at the subdir so the run finds it.
          sed -i "s|^achInFile.*|achInFile = $ic_infile|" $ic_param_file
          # Force serial tipsy writes. At ChaNGa's default bParaWrite a
          # parallel write tears a contiguous block of records -- fields
          # shifted by one with the file length left intact so nothing
          # downstream notices -- which hit 15 of 128 cosmological snapshots
          # and 11 of 128 Poisson ones when measured on 2026-08-07. The key is
          # deleted before being appended because neither shipped param file
          # contains it at all so there is nothing for a plain sed to match.
          sed -i "/^bParaWrite/d" $ic_param_file
          echo "bParaWrite = 0" >> $ic_param_file
          # Deleted then appended for the same reason as bParaWrite: the
          # Poisson param file has no dEta line at all for a plain sed to
          # match. The character class keeps this from also deleting
          # dEtaCourant / dEtauDot / dEtaDiffusion.
          sed -i "/^dEta[[:space:]]*=/d" $ic_param_file
          echo "dEta = $deta" >> $ic_param_file
          # Bounds the traced window without disturbing dDelta. Appended the
          # same way and for the same reason: neither shipped param file has a
          # killAt line. Zero is ChaNGa's own default and disables it.
          sed -i "/^killAt[[:space:]]*=/d" $ic_param_file
          echo "killAt = $killat" >> $ic_param_file
          sed -i "/^iOutInterval[[:space:]]*=/d" $ic_param_file
          echo "iOutInterval = $ioutinterval" >> $ic_param_file

          # NB: keep this whole preprocess body free of commas. JUBE splits a
          # parameter value on its separator (which defaults to a comma) into
          # a list -- so any comma here (even inside a comment) chops the step
          # and only a fragment reaches submit.job.
          #
          # Generates the Poisson cube; expands to a no-op under the cosmo tag.
          $ic_generate

          ./configure
          make -j
      - name: preprocess
        tag: tracing
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH

          git clone --local $source_dir changa-src
          mv changa-src/.git .
          rm -rf changa-src
          git checkout .
          cp -r $structures_dir ./structures
          export STRUCT_DIR=$PWD/structures
          export CHARM_DIR=$repo_root/deps/prefix/charm-changa-projections
          # charm-changa-projections baked a stale PAPI include/lib path into
          # charmc (from wherever PAPI's pkg-config pointed when charm was
          # built) so expose our own deps/prefix PAPI to the compiler here --
          # CPATH lets gcc find papi.h at compile and LIBRARY_PATH finds
          # libpapi at link (charm++.h pulls in trace.h which includes papi.h).
          export CPATH=$repo_root/deps/prefix/include:$CPATH
          export LIBRARY_PATH=$repo_root/deps/prefix/lib:$LIBRARY_PATH

          sed -i "s/^nSteps.*/nSteps = $nsteps/" $ic_param_file
          # Both param files name their input as a bare achInFile which ChaNGa
          # opens relative to the launch cwd (the workpackage root) rather than
          # to the param file -- repoint it at the subdir so the run finds it.
          sed -i "s|^achInFile.*|achInFile = $ic_infile|" $ic_param_file
          # Force serial tipsy writes. At ChaNGa's default bParaWrite a
          # parallel write tears a contiguous block of records -- fields
          # shifted by one with the file length left intact so nothing
          # downstream notices -- which hit 15 of 128 cosmological snapshots
          # and 11 of 128 Poisson ones when measured on 2026-08-07. The key is
          # deleted before being appended because neither shipped param file
          # contains it at all so there is nothing for a plain sed to match.
          sed -i "/^bParaWrite/d" $ic_param_file
          echo "bParaWrite = 0" >> $ic_param_file
          # Deleted then appended for the same reason as bParaWrite: the
          # Poisson param file has no dEta line at all for a plain sed to
          # match. The character class keeps this from also deleting
          # dEtaCourant / dEtauDot / dEtaDiffusion.
          sed -i "/^dEta[[:space:]]*=/d" $ic_param_file
          echo "dEta = $deta" >> $ic_param_file
          # Bounds the traced window without disturbing dDelta. Appended the
          # same way and for the same reason: neither shipped param file has a
          # killAt line. Zero is ChaNGa's own default and disables it.
          sed -i "/^killAt[[:space:]]*=/d" $ic_param_file
          echo "killAt = $killat" >> $ic_param_file
          sed -i "/^iOutInterval[[:space:]]*=/d" $ic_param_file
          echo "iOutInterval = $ioutinterval" >> $ic_param_file

          # NB: keep this whole preprocess body free of commas. JUBE splits a
          # parameter value on its separator (which defaults to a comma) into
          # a list -- so any comma here (even inside a comment) chops the step
          # and only a fragment reaches submit.job.
          #
          # Generates the Poisson cube; expands to a no-op under the cosmo tag.
          $ic_generate

          ./configure --enable-projections
          make -j
      # Same complete trace file set as LeanMD, verified against
      # ../deps/charm/src/ck-perf/trace-projections.C. *.log* covers both plain
      # and gzipped logs. Archive stays in this workpackage's JUBE work
      # directory on purpose. See runs.org.
      - name: postprocess
        tag: tracing
        _: |
          # Anchored on the trace root rather than a bare *.log* glob. Trace
          # files are named after the executable -- Projections takes its
          # traceroot from the executable path -- so they are all ChaNGa.*
          # here. A bare *.log* also matched autoconf's config.log and ChaNGa's
          # own <achOutName>.log run log and the rm then deleted both. That was
          # found on 2026-08-08 by finding cube300.log inside a trace archive
          # and missing from the work directory.
          tar -czf trace_${SLURM_JOBID}_${SLURM_NNODES}_${SLURM_NTASKS}.tar.gz ChaNGa.*.log* ChaNGa.sts ChaNGa.projrc
          rm ChaNGa.*.log* ChaNGa.sts ChaNGa.projrc
          # <achOutName>.physics.csv is deliberately left out of the archive
          # and not deleted. It is the per-TreePiece side file the trace is
          # joined against and it is tiny -- numTreePieces x nSteps rows
          # against a trace measured in gigabytes -- so it stays directly
          # readable beside the tarball rather than needing an untar. Convert
          # it with tools/physics_to_parquet.py.
          ls -l ./*.physics.csv
      # Empty: build-charm.sh only builds the plain MPI Changa variants, not
      # the CUDA target, so no GRES request is needed.
      - name: gres
        _: ""
      - name: queue
        _: kura-wide
      # Double LeanMD's 20 minutes for the build (autoconf, ~50 source files,
      # plus the structures library), then double again for the run. The
      # cancelled 2026-08-08 sweep showed 00:40:00 was not enough even to reach
      # step 39 of 128; with killAt bounding the window the run itself is
      # minutes, but the exit-time trace write of 20-80 PEs is not free.
      - name: timelimit
        _: 01:30:00
      - name: additional_job_config
        _: >
          #SBATCH --exclusive
      # Untagged: the build creates a ./ChaNGa symlink to whichever binary the
      # variant produced.
      - name: executable
        _: ./ChaNGa
      - name: args_exec
        tag: base
        _: $ic_param_file $ppn_flag
      # +gz-trace is deliberately absent. charm-changa-projections is built
      # with -DZLIB=1 so logs are gzipped by default, and on a Charm++ built
      # without zlib the flag is silently ignored, so it could never have
      # helped on its own. See ../docs/design-notes.org.
      - name: args_exec
        tag: tracing
        _: $ic_param_file $ppn_flag +logsize 32000000
  - name: inputset
    parameter:
      - name: total_pes
        type: int
        mode: python
        _: "${nodes}*${taskspernode}*${oversubscription}"
      # N for testdata's Poisson-cube generator, the synthetic input ChaNGa's
      # README recommends for performance benchmarking. That README puts
      # N=100000 at roughly a minute of gravity calculation per step on a
      # GHz-class core; retune once we have real Kabre timings.
      #
      # 1000000 was dropped on 2026-08-08. It was the largest consumer of the
      # 100 GB Lustre quota by a wide margin -- a trivial 20-step 4-PE run at
      # N=10^4 already produced 200 MB of gzipped trace -- and it is the least
      # informative cell in the sweep: the statistical unit here is the
      # chare-step which comes from TreePieces x steps rather than particle
      # count while trace volume scales hardest with particles. The axis that
      # replaced it is IC type x over-decomposition ratio which is cheap in
      # volume.
      - name: problem_size
        tag: poisson
        _: "10000,100000"
      # Not swept for the cosmological IC: cube300 is a fixed 48^3 = 110592
      # particle realisation and cannot be resized. Defined anyway so the one
      # reference to it resolves and so the value appears in JUBE's result
      # table alongside the Poisson runs it is compared against.
      - name: problem_size
        tag: cosmo
        _: "110592"
  - name: executeset
    init_with: platform.xml
    parameter:
      - name: starter
        _: mpirun
      - name: args_starter
        _: -np $total_pes

step:
  # No fileset in `use`, unlike LeanMD: the source tree arrives via the
  # git clone in the preprocess step, not copied in beforehand by JUBE.
  - name: run-program
    use:
      - globalParameter
      - systemParameter
      - inputset
      - executeset
      - from: platform.xml
        _: jobfiles
      - from: platform.xml
        _: executesub
    do:
      done_file: $done_file
      _: $submit $submit_script
