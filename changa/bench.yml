# ChaNGa JUBE benchmark, same tag-gated base/tracing structure as
# ../leanmd/bench.yml. Run with:
#   jube run changa/bench.yml --include-path <jube>/platform/slurm --tag tracing
#
# Editing note, learned across two failed runs: text inside the `_: |` block
# scalars becomes a JUBE parameter value, and JUBE splits those on commas, so
# a single comma anywhere in a preprocess body (even in a shell comment) chops
# the step and only a fragment reaches submit.job. Keep block bodies
# comma-free. YAML-level comments like this one are stripped by the parser
# before JUBE sees them and are safe.
#
# Background and rationale: ../docs/design-notes.org
name: changa
# $jube_benchmark_home is this file's directory, so both paths below are
# relative to changa/, not to the repo root. outpath keeps the JUBE output
# directory at the repo root where it has always been -- trace archives are
# left inside JUBE's numbered run directories and the run log records those
# paths.
outpath: ../changa_bench

parameterset:
  - name: globalParameter
    parameter:
      - name: modules
        _: |
          module purge
          module load mpich/3.1.4-gcc-9.3.0 gcc/9.3.0
      - name: oversubscription
        _: "1"
      # This file lives in changa/, so $jube_benchmark_home is that directory.
      # deps/ is shared with LeanMD and stays at the repo root -- reach it
      # through $repo_root rather than $jube_benchmark_home.
      - name: repo_root
        _: $jube_benchmark_home/..
      - name: source_dir
        _: $jube_benchmark_home/src
      - name: structures_dir
        _: $repo_root/deps/utility/structures
  - name: systemParameter
    init_with: platform.xml
    parameter:
      - name: nodes
        _: "1,2,4"
      - name: taskspernode
        _: "20"
      - name: threadspertask
        _: "1"
      # Spliced into the copied testdata.param during preprocess, rather than
      # passed on the command line the way LeanMD's step count is.
      - name: nsteps
        _: "20"
      # The preprocess clones ChaNGa instead of using a JUBE fileset: ChaNGa
      # generates cha_commitid.c by running `git describe`, which needs an
      # intact .git that a file copy would lose, and each workpackage needs its
      # own build tree so concurrent node-count/problem-size combinations don't
      # race on the same object files. The clone-then-move-.git dance works
      # around JUBE having already written submit.job into this directory,
      # which makes `git clone --local $source_dir .` refuse to run.
      - name: preprocess
        tag: base
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH

          git clone --local $source_dir changa-src
          mv changa-src/.git .
          rm -rf changa-src
          git checkout .
          cp -r $structures_dir ./structures
          export STRUCT_DIR=$PWD/structures
          export CHARM_DIR=$repo_root/deps/prefix/charm-changa

          sed -i "s/^nSteps.*/nSteps = $nsteps/" testdata/testdata.param
          # testdata.tbin is generated inside testdata/ but the param names it
          # as a bare achInFile that ChaNGa opens relative to the launch cwd
          # (the workpackage root) rather than to the param file -- repoint it
          # at the subdir so the run finds its input.
          sed -i "s|^achInFile.*|achInFile = testdata/testdata.tbin|" testdata/testdata.param

          # testdata's standalone Makefile hardcodes its compile line and
          # predates glibc moving the SunRPC/XDR headers into libtirpc. On
          # hosts where the rpc headers now live under /usr/include/tirpc we
          # point its CC/CXX there by hand (ChaNGa's own ./configure already
          # does the equivalent for its main build) -- a no-op where the rpc
          # headers are still in libc.
          #
          # NB: keep this whole preprocess body free of commas. JUBE splits a
          # parameter value on its separator (which defaults to a comma) into
          # a list -- so any comma here (even inside a comment) chops the step
          # and only a fragment reaches submit.job.
          tirpc_flags=""
          if [ -f /usr/include/tirpc/rpc/types.h ]; then
            tirpc_flags="-I/usr/include/tirpc -ltirpc"
          fi
          make -C testdata N=$problem_size CC="gcc $tirpc_flags" CXX="g++ $tirpc_flags"

          ./configure
          make -j
      - name: preprocess
        tag: tracing
        _: |
          $modules
          export LD_LIBRARY_PATH=$repo_root/deps/prefix/lib:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=$repo_root/deps/prefix/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=$repo_root/deps/prefix/bin:$PATH

          git clone --local $source_dir changa-src
          mv changa-src/.git .
          rm -rf changa-src
          git checkout .
          cp -r $structures_dir ./structures
          export STRUCT_DIR=$PWD/structures
          export CHARM_DIR=$repo_root/deps/prefix/charm-changa-projections
          # charm-changa-projections baked a stale PAPI include/lib path into
          # charmc (from wherever PAPI's pkg-config pointed when charm was
          # built) so expose our own deps/prefix PAPI to the compiler here --
          # CPATH lets gcc find papi.h at compile and LIBRARY_PATH finds
          # libpapi at link (charm++.h pulls in trace.h which includes papi.h).
          export CPATH=$repo_root/deps/prefix/include:$CPATH
          export LIBRARY_PATH=$repo_root/deps/prefix/lib:$LIBRARY_PATH

          sed -i "s/^nSteps.*/nSteps = $nsteps/" testdata/testdata.param
          # testdata.tbin is generated inside testdata/ but the param names it
          # as a bare achInFile that ChaNGa opens relative to the launch cwd
          # (the workpackage root) rather than to the param file -- repoint it
          # at the subdir so the run finds its input.
          sed -i "s|^achInFile.*|achInFile = testdata/testdata.tbin|" testdata/testdata.param

          # testdata's standalone Makefile hardcodes its compile line and
          # predates glibc moving the SunRPC/XDR headers into libtirpc. On
          # hosts where the rpc headers now live under /usr/include/tirpc we
          # point its CC/CXX there by hand (ChaNGa's own ./configure already
          # does the equivalent for its main build) -- a no-op where the rpc
          # headers are still in libc.
          #
          # NB: keep this whole preprocess body free of commas. JUBE splits a
          # parameter value on its separator (which defaults to a comma) into
          # a list -- so any comma here (even inside a comment) chops the step
          # and only a fragment reaches submit.job.
          tirpc_flags=""
          if [ -f /usr/include/tirpc/rpc/types.h ]; then
            tirpc_flags="-I/usr/include/tirpc -ltirpc"
          fi
          make -C testdata N=$problem_size CC="gcc $tirpc_flags" CXX="g++ $tirpc_flags"

          ./configure --enable-projections
          make -j
      # Same complete trace file set as LeanMD, verified against
      # ../deps/charm/src/ck-perf/trace-projections.C. *.log* covers both plain
      # and gzipped logs. Archive stays in this workpackage's JUBE work
      # directory on purpose. See runs.org.
      - name: postprocess
        tag: tracing
        _: |
          tar -czf trace_${SLURM_JOBID}_${SLURM_NNODES}_${SLURM_NTASKS}.tar.gz *.log* *.sts *.projrc
          rm *.log* *.sts *.projrc
      # Empty: build-charm.sh only builds the plain MPI Changa variants, not
      # the CUDA target, so no GRES request is needed.
      - name: gres
        _: ""
      - name: queue
        _: kura-wide
      # Double LeanMD's 20 minutes. ChaNGa's build (autoconf, ~50 source files,
      # plus the structures library) is heavier than LeanMD's single Makefile.
      - name: timelimit
        _: 00:40:00
      - name: additional_job_config
        _: >
          #SBATCH --exclusive
      # Untagged: the build creates a ./ChaNGa symlink to whichever binary the
      # variant produced.
      - name: executable
        _: ./ChaNGa
      - name: args_exec
        tag: base
        _: testdata/testdata.param
      # +gz-trace is deliberately absent. charm-changa-projections is built
      # with -DZLIB=1 so logs are gzipped by default, and on a Charm++ built
      # without zlib the flag is silently ignored, so it could never have
      # helped on its own. See ../docs/design-notes.org.
      - name: args_exec
        tag: tracing
        _: testdata/testdata.param +logsize 32000000
  - name: inputset
    parameter:
      - name: total_pes
        type: int
        mode: python
        _: "${nodes}*${taskspernode}*${oversubscription}"
      # N for testdata's Poisson-cube generator, the synthetic input ChaNGa's
      # README recommends for performance benchmarking. That README puts
      # N=100000 at roughly a minute of gravity calculation per step on a
      # GHz-class core; retune once we have real Kabre timings.
      - name: problem_size
        _: "10000,100000,1000000"
  - name: executeset
    init_with: platform.xml
    parameter:
      - name: starter
        _: mpirun
      - name: args_starter
        _: -np $total_pes

step:
  # No fileset in `use`, unlike LeanMD: the source tree arrives via the
  # git clone in the preprocess step, not copied in beforehand by JUBE.
  - name: run-program
    use:
      - globalParameter
      - systemParameter
      - inputset
      - executeset
      - from: platform.xml
        _: jobfiles
      - from: platform.xml
        _: executesub
    do:
      done_file: $done_file
      _: $submit $submit_script
